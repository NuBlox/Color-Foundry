name: Cleanup completed Color Foundry branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the merged hydration task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh api repos/NuBlox/Color-Foundry/pulls/1 --jq '.merged')" != 'true' ]]; then
            echo 'PR #1 is not merged, refusing to delete the branch.' >&2
            exit 1
          fi
          gh api -X DELETE 'repos/NuBlox/Color-Foundry/git/refs/heads/fix/sveltekit-hydration-and-persistence'
