<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a saved manual choice before CSS renders to reduce theme flash. -->
    <script>
      try {
        const preference = localStorage.getItem('color-foundry-theme');
        if (preference === 'dark' || preference === 'light') {
          document.documentElement.dataset.theme = preference;
        }
        const brand = localStorage.getItem('color-foundry-brand');
        // Any valid slug can be restored. The generated CSS allowlists only
        // configured brands, and the Svelte component clears unknown values.
        if (brand && /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/.test(brand)) {
          document.documentElement.dataset.brand = brand;
        }
      } catch (_) { /* Private browsing can disable storage. OS mode still works. */ }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
